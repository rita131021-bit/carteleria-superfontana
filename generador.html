<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de Cartelería · Super Fontana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fredoka:wght@400;600;700&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:#efe9df; display:flex; min-height:100vh; }
  .panel { width: 390px; background:#1a1a1a; color:#fff; padding:24px; overflow-y:auto; max-height:100vh; }
  .panel h1 { font-size:18px; margin:0 0 4px; }
  .panel .sub { font-size:12px; color:#999; margin-bottom:18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#aaa; margin-bottom:6px; }
  .field input[type=text], .field select {
    width:100%; padding:9px 10px; border:1px solid #444; background:#2a2a2a; color:#fff; border-radius:4px; font-size:14px;
  }
  .field input[type=color] { width:100%; height:36px; border:1px solid #444; background:#2a2a2a; border-radius:4px; }
  .field input[type=file] { width:100%; font-size:12px; color:#ccc; }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1; }
  .style-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .style-grid button {
    padding:12px 6px; background:#2a2a2a; border:2px solid #444; color:#ccc;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:bold;
  }
  .style-grid button.active { border-color:#d00000; color:#fff; background:#3a1414; }
  button#download {
    width:100%; padding:13px; background:#d00000; color:#fff; border:none;
    border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer; margin-top:8px; letter-spacing:.5px;
  }
  button#download:hover { background:#b00000; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:40px; }
  #cartel { box-shadow:0 20px 60px rgba(0,0,0,.3); border-radius:6px; max-height:92vh; }
  .toggle { display:flex; align-items:center; gap:8px; font-size:12px; color:#ccc; margin:2px 0 14px; }
</style>
</head>
<body>

<div class="panel">
  <h1>Cartelería Super Fontana</h1>
  <div class="sub">Generador creativo · sin costo</div>

  <div class="style-grid" id="styleGrid">
    <button data-style="dinamico" class="active">⚡ Dinámico</button>
    <button data-style="creativa">🎨 Creativa</button>
    <button data-style="combo">🎀 Cinta / Combo</button>
    <button data-style="clasico">🧊 Clásico</button>
  </div>

  <label class="toggle"><input type="checkbox" id="grainToggle" checked> Textura/grano (efecto papel)</label>

  <div class="field">
    <label>Etiqueta superior</label>
    <input type="text" id="etiqueta" value="¡NUEVO!">
  </div>
  <div class="field">
    <label>Título / Marca</label>
    <input type="text" id="nombre" value="SIGNO">
  </div>
  <div class="field">
    <label>Subtítulo</label>
    <input type="text" id="subtitulo" value="Fragancia perdurable">
  </div>
  <div class="field">
    <label>Formato / peso</label>
    <input type="text" id="formato" value="3 KG">
  </div>
  <div class="row2">
    <div class="field"><label>Precio entero</label><input type="text" id="precioEntero" value="5.799"></div>
    <div class="field"><label>Centavos</label><input type="text" id="precioDecimal" value="99"></div>
  </div>
  <div class="field">
    <label>Foto del producto</label>
    <input type="file" id="imagenProducto" accept="image/*">
  </div>
  <div class="row2">
    <div class="field"><label>Color primario</label><input type="color" id="colorA" value="#0a2f6b"></div>
    <div class="field"><label>Color secundario</label><input type="color" id="colorB" value="#3a8bd8"></div>
  </div>

  <button id="download">Descargar cartel (PNG)</button>
</div>

<div class="stage"><canvas id="cartel" width="900" height="1300"></canvas></div>

function stickerText(text, x, y, font, fillColor, align='center', outlineColor='#ffffff', outlineW=10, shadow=true) {
  ctx.font = font;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  if (shadow) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 6;
    ctx.fillStyle = fillColor;
    ctx.fillText(text, x, y);
    ctx.restore();
  }
  if (outlineW > 0) {
    ctx.lineWidth = outlineW;
    ctx.strokeStyle = outlineColor;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = fillColor;
  ctx.fillText(text, x, y);
}

function gradientText(text, x, y, font, colorA, colorB, align='center') {
  ctx.font = font;
  ctx.textAlign = align;
  const h = parseInt(font.match(/\d+/)[0]);
  let grad = ctx.createLinearGradient(0, y-h*0.85, 0, y+h*0.15);
  grad.addColorStop(0, colorA);
  grad.addColorStop(1, colorB);
  ctx.lineJoin='round';
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#ffffff';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = grad;
  ctx.fillText(text, x, y);
}

function brushStroke(cx, cy, w, h, angle, color, seedOffset=0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  const jag = (i, amp) => Math.sin(i*13 + seedOffset)*amp;
  ctx.beginPath();
  const steps = 10;
  for (let i=0;i<=steps;i++){
    const px = -w/2 + (w/steps)*i;
    const py = -h/2 + jag(i, h*0.12);
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  for (let i=steps;i>=0;i--){
    const px = -w/2 + (w/steps)*i;
    const py = h/2 + jag(i+4, h*0.12);
    ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBurstRing(cx, cy, rInner, rOuter, count, color, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.translate(cx, cy);
  for (let i=0;i<count;i++){
    const a = (i/count) * Math.PI*2;
    const a2 = a + (Math.PI*2/count)*0.45;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*rInner, Math.sin(a)*rInner);
    ctx.lineTo(Math.cos(a)*rOuter, Math.sin(a)*rOuter);
    ctx.lineTo(Math.cos(a2)*rOuter, Math.sin(a2)*rOuter);
    ctx.lineTo(Math.cos(a2)*rInner, Math.sin(a2)*rInner);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function sparkBurst(cx, cy, color, scale=1) {
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  const rays = [[-1,-0.3],[-0.6,-1],[0,-1.2],[0.6,-1],[1,-0.3]];
  rays.forEach(([dx,dy])=>{
    ctx.lineWidth = 5*scale;
    ctx.beginPath();
    ctx.moveTo(cx+dx*10*scale, cy+dy*10*scale);
    ctx.lineTo(cx+dx*32*scale, cy+dy*32*scale);
    ctx.stroke();
  });
}

let grainCanvas = null;
function getGrain(w,h){
  if (grainCanvas && grainCanvas.width===w) return grainCanvas;
  const g = document.createElement('canvas');
  g.width = w; g.height = h;
  const gctx = g.getContext('2d');
  const imgData = gctx.createImageData(w,h);
  for (let i=0;i<imgData.data.length;i+=4){
    const v = 255 - Math.floor(Math.random()*40);
    imgData.data[i]=v; imgData.data[i+1]=v; imgData.data[i+2]=v; imgData.data[i+3]= Math.random()<0.5?18:0;
  }
  gctx.putImageData(imgData,0,0);
  grainCanvas = g;
  return g;
}
function applyGrain(){
  if (!document.getElementById('grainToggle').checked) return;
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.5;
  ctx.drawImage(getGrain(canvas.width,canvas.height),0,0);
  ctx.restore();
}

function drawLogo(W,H,size=95){
  if (logoImg.complete && logoImg.naturalWidth) {
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=10;
    ctx.drawImage(logoImg, W-size-30, H-size-30, size, size);
    ctx.restore();
  }
}

function drawProductImage(cx, cy, maxW, maxH, dropShadow=true){
  if (!productImg) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(cx-maxW/2, cy-maxH/2, maxW, maxH);
    ctx.fillStyle = '#fff';
    ctx.font = '18px Arial';
    ctx.textAlign='center';
    ctx.fillText('Subí la foto del producto', cx, cy);
    return;
  }
  const scale = Math.min(maxW/productImg.width, maxH/productImg.height);
  const iw = productImg.width*scale, ih = productImg.height*scale;
  if (dropShadow) {
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=25; ctx.shadowOffsetY=18;
    ctx.drawImage(productImg, cx-iw/2, cy-ih/2, iw, ih);
    ctx.restore();
  } else {
    ctx.drawImage(productImg, cx-iw/2, cy-ih/2, iw, ih);
  }
}

function bigPrice(x, y, entero, decimal, colorMain, colorAccent, outline='#ffffff'){
  ctx.textBaseline='alphabetic';
  let cursor = x;
  ctx.font = '700 42px Fredoka';
  ctx.textAlign='left';
  ctx.lineWidth=8; ctx.strokeStyle=outline; ctx.fillStyle=colorAccent;
  ctx.strokeText('$', cursor, y); ctx.fillText('$', cursor, y);
  cursor += ctx.measureText('$').width + 10;

  ctx.font = '900 118px Anton';
  ctx.lineWidth=10; ctx.strokeStyle=outline;
  ctx.strokeText(entero, cursor, y+4);
  ctx.fillStyle = colorMain;
  ctx.fillText(entero, cursor, y+4);
  cursor += ctx.measureText(entero).width + 8;

  ctx.font = '700 46px Fredoka';
  ctx.lineWidth=7; ctx.strokeStyle=outline; ctx.fillStyle=colorAccent;
  ctx.strokeText(','+decimal, cursor, y+4);
  ctx.fillText(','+decimal, cursor, y+4);
}

function drawDinamico(d){
  const W=canvas.width,H=canvas.height;
  const cA=d.colorA, cB=d.colorB;

  let bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,cB); bg.addColorStop(1,cA);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  drawBurstRing(W/2,250,40,900,44,'rgba(255,255,255,0.07)');
  drawBurstRing(W/2,250,40,900,44,'rgba(255,255,255,0.10)',0.6);

  let halo = ctx.createRadialGradient(W/2,260,10,W/2,260,360);
  halo.addColorStop(0,'rgba(255,255,255,0.5)'); halo.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);

  if (d.etiqueta){
    ctx.save();
    ctx.translate(150,75); ctx.rotate(-0.09);
    brushStroke(0,0,240,72,0,'#f2c400',3);
    ctx.restore();
    stickerText(d.etiqueta.toUpperCase(), 150, 88, '400 40px "Permanent Marker"', '#0a2f6b','center','#ffffff',0,false);
  }

  stickerText(d.nombre.toUpperCase(), W/2, 305, '900 128px Anton', '#ffffff','center', cA, 12);
  sparkBurst(95, 220, '#ffffff', 1.3);
  sparkBurst(W-95, 220, '#ffffff', 1.3);

  if (d.subtitulo){
    stickerText('✦ '+d.subtitulo.toUpperCase()+' ✦', W/2, 362, '700 34px Fredoka', '#ffffff','center','#000000',0,false);
  }

  if (d.formato){
    ctx.save();
    ctx.translate(W/2, 412); ctx.rotate(0.02);
    ctx.font='700 32px Fredoka';
    const bw = ctx.measureText(d.formato.toUpperCase()).width + 60;
    brushStroke(0,0,bw,58,0,'#f2c400',7);
    ctx.restore();
    stickerText(d.formato.toUpperCase(), W/2, 424, '700 32px Fredoka', '#0a2f6b','center','#ffffff',0,false);
  }

  drawProductImage(W/2, 800, W-180, 600);

  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fillRect(0,H-230,W,230);
  ctx.fillStyle=cA;
  ctx.fillRect(0,H-215,W,8);

  bigPrice(70,H-88,d.entero,d.decimal,'#ffffff','#f2c400','#0a2f6b');
  drawLogo(W,H);
  applyGrain();
}

function drawCreativa(d){
  const W=canvas.width,H=canvas.height;
  const cA=d.colorA, cB=d.colorB;

  // fondo blanco + bloque diagonal de color de fondo
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(W,0); ctx.lineTo(W,H*0.62); ctx.lineTo(0,H*0.42);
  ctx.closePath();
  let diagGrad = ctx.createLinearGradient(0,0,W,H*0.5);
  diagGrad.addColorStop(0,cA); diagGrad.addColorStop(1,cB);
  ctx.fillStyle=diagGrad; ctx.fill();
  ctx.restore();

  // circulo de acento detras, descentrado (glow tipo collage)
  let glow = ctx.createRadialGradient(W*0.78,H*0.58,20,W*0.78,H*0.58,300);
  glow.addColorStop(0,'rgba(255,255,255,0.55)'); glow.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

  // etiqueta tipo sello circular, rotada, arriba a la izquierda
  if (d.etiqueta){
    ctx.save();
    ctx.translate(140,150); ctx.rotate(-0.25);
    ctx.beginPath();
    ctx.arc(0,0,95,0,Math.PI*2);
    ctx.fillStyle='#ffffff';
    ctx.fill();
    ctx.setLineDash([6,5]);
    ctx.lineWidth=4; ctx.strokeStyle=cB;
    ctx.beginPath(); ctx.arc(0,0,82,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    stickerText(d.etiqueta.toUpperCase(), 140, 162, '900 30px Anton', cA,'center', 'transparent', 0, false);
  }

  // titulo grande, dos lineas superpuestas ligeramente rotadas, con relleno solido blanco+color
  ctx.save();
  ctx.translate(W/2, 250);
  ctx.rotate(-0.03);
  stickerText(d.nombre.toUpperCase(), 6, 6, '900 118px Anton', 'rgba(0,0,0,0.18)', 'center', 'transparent', 0, false);
  stickerText(d.nombre.toUpperCase(), 0, 0, '900 118px Anton', '#ffffff', 'center', cA, 10, false);
  ctx.restore();
  sparkBurst(120,170,'#ffffff',1.4);
  sparkBurst(W-120,170,'#ffffff',1.4);

  if (d.subtitulo){
    ctx.save();
    ctx.translate(W/2, 330); ctx.rotate(0.015);
    ctx.font='400 46px "Permanent Marker"';
    ctx.fillStyle='#ffffff';
    ctx.textAlign='center';
    ctx.fillText(d.subtitulo, 0, 0);
    ctx.restore();
  }

  // etiqueta de formato tipo bandera pegada al costado
  if (d.formato){
    ctx.save();
    ctx.translate(W-90, 470); ctx.rotate(-Math.PI/2);
    ctx.font='700 30px Fredoka';
    const fw = ctx.measureText(d.formato.toUpperCase()).width + 40;
    ctx.fillStyle='#111';
    ctx.fillRect(-fw/2,-26,fw,52);
    stickerText(d.formato.toUpperCase(),0,10,'700 30px Fredoka','#ffffff','center','transparent',0,false);
    ctx.restore();
  }

  drawProductImage(W/2, 830, W-220, 560);

  // sello de precio tipo timbre, rotado, con borde dentado
  const px = W/2, py = H-170;
  ctx.save();
  ctx.translate(px,py); ctx.rotate(0.06);
  ctx.fillStyle = cA;
  const spikes=28, rOut=250, rIn=235;
  ctx.beginPath();
  for(let i=0;i<spikes*2;i++){
    const r = i%2===0?rOut:rIn;
    const a = (Math.PI*i)/spikes;
    const xx = Math.cos(a)*r, yy = Math.sin(a)*r*0.42;
    if(i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(px,py); ctx.rotate(0.06);
  ctx.textAlign='center';
  ctx.font='700 34px Fredoka';
  ctx.fillStyle='#fff';
  ctx.fillText('$', -150, -18);
  ctx.font='900 96px Anton';
  ctx.fillStyle='#fff';
  ctx.fillText(d.entero, 10, 0);
  ctx.font='700 38px Fredoka';
  ctx.fillText(','+d.decimal, 155, -12);
  ctx.restore();

  drawLogo(W,H);
  applyGrain();
}

function drawCombo(d){
  const W=canvas.width,H=canvas.height;
  const cA=d.colorA, cB=d.colorB;

  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=cA; ctx.lineWidth=5; ctx.strokeRect(14,14,W-28,H-28);

  if (d.etiqueta){
    stickerText(d.etiqueta.toUpperCase(), W/2, 105, '900 52px Anton', cA,'center','#ffffff',9);
    sparkBurst(150,80,cA,1); sparkBurst(W-150,80,cA,1);
  }

  gradientText(d.nombre.toUpperCase(), W/2, 225, '900 112px Anton', cA, cB, 'center');

  ctx.save();
  ctx.translate(W/2,272); ctx.rotate(0.012);
  brushStroke(0,0,500,72,0,cB,5);
  ctx.restore();
  stickerText(d.formato.toUpperCase(), W/2, 288, '700 36px Fredoka', '#ffffff','center','rgba(0,0,0,0.2)',0,false);

  if (d.subtitulo){
    stickerText(d.subtitulo.toUpperCase(), W/2, 345, '700 27px Fredoka', '#333','center','#ffffff',0,false);
  }

  drawProductImage(W/2, 760, W-200, 610);

  const py = H-150;
  ctx.save();
  ctx.translate(W/2,py); ctx.rotate(-0.015);
  ctx.fillStyle=cA;
  const rw=700, rh=150, r=22;
  ctx.beginPath();
  ctx.moveTo(-rw/2+r,-rh/2);
  ctx.arcTo(rw/2,-rh/2,rw/2,rh/2,r);
  ctx.arcTo(rw/2,rh/2,-rw/2,rh/2,r);
  ctx.arcTo(-rw/2,rh/2,-rw/2,-rh/2,r);
  ctx.arcTo(-rw/2,-rh/2,rw/2,-rh/2,r);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=5; ctx.stroke();
  ctx.restore();

  bigPrice(W/2-320,py+35,d.entero,d.decimal,'#ffffff','#ffffff',cA);
  ctx.strokeStyle=cB; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(W/2-320,py+55); ctx.lineTo(W/2-60,py+55); ctx.stroke();

  drawLogo(W,H);
  applyGrain();
}

function drawClasico(d){
  const W=canvas.width,H=canvas.height;
  const color=d.colorA;

  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=color; ctx.lineWidth=8; ctx.strokeRect(14,14,W-28,H-28);

  stickerText(d.nombre.toUpperCase(), W/2, 140, '900 82px Anton', '#111','center','#ffffff',8);
  sparkBurst(70,90,color,1); sparkBurst(W-70,90,color,1);

  let bandY=250;
  if (d.subtitulo){
    ctx.save();
    ctx.translate(W/2,bandY); ctx.rotate(-0.01);
    brushStroke(0,0,640,90,0,color,4);
    ctx.restore();
    stickerText(d.subtitulo.toUpperCase(), W/2, bandY+22, '900 58px Anton', '#ffffff','center','rgba(0,0,0,0.15)',0,false);
    bandY+=90;
  }

  if (d.formato){
    ctx.font='700 30px Fredoka';
    const bw=ctx.measureText(d.formato.toUpperCase()).width+50;
    ctx.save();
    ctx.translate(W-bw/2-50, bandY+20); ctx.rotate(0.02);
    brushStroke(0,0,bw,54,0,color,9);
    ctx.restore();
    stickerText(d.formato.toUpperCase(), W-bw/2-50, bandY+30,'700 30px Fredoka','#ffffff','center','rgba(0,0,0,0.15)',0,false);
  }

  drawProductImage(W/2, bandY+320, W-160, 550);

  const py=H-165;
  ctx.save();
  ctx.translate(W/2,py+70); ctx.rotate(-0.008);
  ctx.fillStyle=color;
  ctx.fillRect(-300,-70,600,140);
  ctx.restore();
  bigPrice(W/2-260,py+95,d.entero,d.decimal,'#fff','#fff',color);

  drawLogo(W,H);
  applyGrain();
}

function draw(){
  const d = {
    etiqueta: document.getElementById('etiqueta').value,
    nombre: document.getElementById('nombre').value,
    subtitulo: document.getElementById('subtitulo').value,
    formato: document.getElementById('formato').value,
    entero: document.getElementById('precioEntero').value,
    decimal: document.getElementById('precioDecimal').value,
    colorA: document.getElementById('colorA').value,
    colorB: document.getElementById('colorB').value,
  };
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (currentStyle==='dinamico') drawDinamico(d);
  else if (currentStyle==='creativa') drawCreativa(d);
  else if (currentStyle==='combo') drawCombo(d);
  else drawClasico(d);
}

document.getElementById('imagenProducto').addEventListener('change', e=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{ productImg = img; draw(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

['etiqueta','nombre','subtitulo','formato','precioEntero','precioDecimal','colorA','colorB','grainToggle'].forEach(id=>{
  document.getElementById(id).addEventListener('input', draw);
});

document.getElementById('download').addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'cartel_' + document.getElementById('nombre').value.toLowerCase().replace(/\s+/g,'_') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

logoImg.onload = draw;
setTimeout(draw, 150);
</script>
