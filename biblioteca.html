<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Cartelería · Super Fontana</title>
<style>
  /* ======= CAMBIAR ESTA LINEA POR TU URL DE RAILWAY ======= */
</style>
</head>
<body>
<script>
  // ======= CAMBIAR ESTA LINEA POR TU URL DE RAILWAY DESPUES DE DESPLEGAR =======
  const API_URL = "http://localhost:3000";
</script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:#efe9df; }
  header { background:#1a1a1a; color:#fff; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; margin:0; }
  header .status { font-size:12px; color:#999; }
  .tabs { display:flex; gap:8px; padding:16px 24px 0; flex-wrap:wrap; background:#efe9df; }
  .tabs button {
    padding:8px 14px; border-radius:20px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:12px;
  }
  .tabs button.active { background:#d00000; color:#fff; border-color:#d00000; }
  .toolbar { padding:16px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toolbar select, .toolbar input[type=text] { padding:8px; border-radius:4px; border:1px solid #ccc; }
  .toolbar input[type=file] { font-size:12px; }
  .toolbar button.upload { background:#0a2f6b; color:#fff; border:none; padding:9px 16px; border-radius:4px; cursor:pointer; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:14px; padding:10px 24px 40px; }
  .card { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08); cursor:pointer; }
  .card img { width:100%; height:150px; object-fit:cover; display:block; background:#f2f2f2; }
  .card .meta { padding:8px; font-size:11px; color:#555; }

  /* editor modal */
  #editorModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:50; }
  #editorInner { position:absolute; inset:20px; background:#1a1a1a; border-radius:10px; display:flex; overflow:hidden; }
  .panel { width:340px; color:#fff; padding:20px; overflow-y:auto; }
  .panel h2 { font-size:15px; margin:0 0 14px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:11px; text-transform:uppercase; color:#aaa; margin-bottom:5px; }
  .field input[type=text], .field input[type=number] { width:100%; padding:7px 8px; border:1px solid #444; background:#2a2a2a; color:#fff; border-radius:4px; }
  .field input[type=color] { width:100%; height:30px; }
  .row2 { display:flex; gap:8px; }
  .row2 .field { flex:1; }
  .patch-item { background:#232323; border:1px solid #3a3a3a; border-radius:6px; padding:8px; margin-bottom:6px; cursor:pointer; font-size:11px; }
  .patch-item.selected { border-color:#d00000; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
  #editCanvas { max-width:100%; max-height:100%; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  button { cursor:pointer; }
  .btn { padding:10px; border-radius:6px; border:1px solid #555; background:#333; color:#fff; width:100%; margin-bottom:8px; font-size:13px; }
  .btn.primary { background:#d00000; border:none; font-weight:bold; }
  .btn.save { background:#1e6b1e; border:none; font-weight:bold; }
  .closeBtn { position:absolute; top:14px; right:20px; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
</style>

<header>
  <h1>Biblioteca de Cartelería · Super Fontana</h1>
  <div class="status" id="status">conectando...</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="toolbar">
  <input type="file" id="fileUpload" accept="image/*">
  <select id="catUpload"></select>
  <input type="text" id="nombreUpload" placeholder="nombre (opcional)">
  <button class="upload" id="btnUpload">+ Subir cartel</button>
</div>

<div class="grid" id="grid"></div>

<div id="editorModal">
  <div id="editorInner">
    <button class="closeBtn" id="closeEditor">✕</button>
    <div class="panel">
      <h2>Editar cartel</h2>
      <button class="btn" id="addPatch">+ Agregar parche (texto/precio)</button>

      <div id="patchFields" style="display:none;">
        <div class="field"><label>Texto</label><input type="text" id="pText" value="$ 0.000,00"></div>
        <div class="row2">
          <div class="field"><label>Ancho</label><input type="number" id="pW" value="400"></div>
          <div class="field"><label>Alto</label><input type="number" id="pH" value="120"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Letra</label><input type="number" id="pFont" value="70"></div>
          <div class="field"><label>Fondo</label><input type="color" id="pBg" value="#0a2f6b"></div>
        </div>
        <div class="field"><label>Color texto</label><input type="color" id="pColor" value="#ffffff"></div>
      </div>

      <div id="patchList"></div>
      <div style="margin-top:16px;">
        <button class="btn save" id="saveToBackend">Guardar cambios (backend)</button>
        <button class="btn primary" id="downloadEdit">Descargar PNG</button>
      </div>
    </div>
    <div class="stage"><canvas id="editCanvas" width="900" height="1300"></canvas></div>
  </div>
</div>

<script>
const CATEGORIAS = [
  {id:'01_marcas', label:'Marcas'},
  {id:'02_gondola_producto', label:'Góndola/Producto'},
  {id:'03_precio_mayorista', label:'Precio mayorista'},
  {id:'04_variedades_mismo_precio', label:'Variedades mismo precio'},
  {id:'05_sin_imagen_solo_texto', label:'Sin imagen'},
  {id:'06_logo_plantilla', label:'Logo'}
];
let activeCat = 'todos';
let currentEditId = null;

const statusEl = document.getElementById('status');

function initTabs() {
  const tabs = document.getElementById('tabs');
  const allBtn = document.createElement('button');
  allBtn.textContent = 'Todos'; allBtn.className='active';
  allBtn.onclick = () => { activeCat='todos'; refreshTabs(); loadGrid(); };
  tabs.appendChild(allBtn);
  CATEGORIAS.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.label;
    b.onclick = () => { activeCat = c.id; refreshTabs(); loadGrid(); };
    tabs.appendChild(b);
  });
  const sel = document.getElementById('catUpload');
  CATEGORIAS.forEach(c => {
    const o = document.createElement('option'); o.value=c.id; o.textContent=c.label;
    sel.appendChild(o);
  });
}
function refreshTabs() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  const idx = activeCat==='todos' ? 0 : CATEGORIAS.findIndex(c=>c.id===activeCat)+1;
  document.querySelectorAll('.tabs button')[idx].classList.add('active');
}

async function loadGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '<p style="color:#888;padding:10px;">Cargando...</p>';
  try {
    const url = activeCat==='todos' ? `${API_URL}/api/carteles` : `${API_URL}/api/carteles?categoria=${activeCat}`;
    const res = await fetch(url);
    const data = await res.json();
    statusEl.textContent = `conectado · ${data.length} carteles`;
    grid.innerHTML = '';
    data.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${API_URL}/api/carteles/${c.id}/imagen" loading="lazy">
        <div class="meta">${c.nombre || '(sin nombre)'}<br>${c.categoria}</div>`;
      card.onclick = () => openEditor(c.id);
      grid.appendChild(card);
    });
  } catch (e) {
    grid.innerHTML = '<p style="color:#c00;padding:10px;">No se pudo conectar al backend. Revisá API_URL arriba del archivo.</p>';
    statusEl.textContent = 'sin conexión';
  }
}

document.getElementById('btnUpload').addEventListener('click', async () => {
  const file = document.getElementById('fileUpload').files[0];
  if (!file) { alert('Elegí un archivo primero'); return; }
  const form = new FormData();
  form.append('imagen', file);
  form.append('categoria', document.getElementById('catUpload').value);
  form.append('nombre', document.getElementById('nombreUpload').value);
  const res = await fetch(`${API_URL}/api/carteles`, { method:'POST', body: form });
  if (res.ok) {
    document.getElementById('fileUpload').value = '';
    document.getElementById('nombreUpload').value = '';
    loadGrid();
  } else {
    alert('Error al subir el cartel');
  }
});

// ---------------- EDITOR (parches sobre la imagen real del backend) ----------------
const ectx = document.getElementById('editCanvas').getContext('2d');
const editCanvas = document.getElementById('editCanvas');
let baseImage = null;
let patches = [];
let selectedId = null, nextId = 1, dragging=false, dragOffX=0, dragOffY=0;

function openEditor(id) {
  currentEditId = id;
  patches = []; selectedId = null;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    baseImage = img;
    editCanvas.width = img.width;
    editCanvas.height = img.height;
    render();
  };
  img.src = `${API_URL}/api/carteles/${id}/imagen`;
  document.getElementById('editorModal').style.display = 'block';
}
document.getElementById('closeEditor').onclick = () => { document.getElementById('editorModal').style.display='none'; };

document.getElementById('addPatch').onclick = () => {
  if (!baseImage) return;
  const p = { id: nextId++, x: editCanvas.width/2-200, y: editCanvas.height-220, w:400, h:120, text:'$ 0.000,00', fontSize:70, bg:'#0a2f6b', color:'#ffffff' };
  patches.push(p); selectPatch(p.id); render();
};

function selectPatch(id) {
  selectedId = id;
  const p = patches.find(p=>p.id===id);
  document.getElementById('patchFields').style.display = p ? 'block':'none';
  if (p) {
    pText.value=p.text; pW.value=p.w; pH.value=p.h; pFont.value=p.fontSize; pBg.value=p.bg; pColor.value=p.color;
  }
  renderList();
}
['pText','pW','pH','pFont','pBg','pColor'].forEach(id=>{
  document.getElementById(id).addEventListener('input', () => {
    const p = patches.find(p=>p.id===selectedId); if(!p) return;
    p.text=pText.value; p.w=+pW.value; p.h=+pH.value; p.fontSize=+pFont.value; p.bg=pBg.value; p.color=pColor.value;
    render();
  });
});

function renderList() {
  const list = document.getElementById('patchList');
  list.innerHTML='';
  patches.forEach(p=>{
    const d = document.createElement('div');
    d.className='patch-item'+(p.id===selectedId?' selected':'');
    d.textContent = (p.text||'parche') + ` (${p.w}×${p.h})`;
    d.onclick = ()=>{ selectPatch(p.id); render(); };
    list.appendChild(d);
  });
}

function render() {
  ectx.clearRect(0,0,editCanvas.width,editCanvas.height);
  if (baseImage) ectx.drawImage(baseImage,0,0,editCanvas.width,editCanvas.height);
  patches.forEach(p=>{
    ectx.fillStyle=p.bg; ectx.fillRect(p.x,p.y,p.w,p.h);
    ectx.fillStyle=p.color; ectx.font='bold '+p.fontSize+'px Arial';
    ectx.textAlign='center'; ectx.textBaseline='middle';
    ectx.fillText(p.text, p.x+p.w/2, p.y+p.h/2, p.w-10);
    if (p.id===selectedId){ ectx.strokeStyle='#ff2d2d'; ectx.lineWidth=3; ectx.setLineDash([8,6]); ectx.strokeRect(p.x,p.y,p.w,p.h); ectx.setLineDash([]); }
  });
  renderList();
}

function coords(e){
  const r = editCanvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(editCanvas.width/r.width), y:(e.clientY-r.top)*(editCanvas.height/r.height) };
}
editCanvas.addEventListener('mousedown', e=>{
  const {x,y}=coords(e);
  for (let i=patches.length-1;i>=0;i--){
    const p=patches[i];
    if (x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){ selectPatch(p.id); dragging=true; dragOffX=x-p.x; dragOffY=y-p.y; render(); return; }
  }
  selectedId=null; render();
});
editCanvas.addEventListener('mousemove', e=>{
  if(!dragging||selectedId===null) return;
  const {x,y}=coords(e);
  const p=patches.find(p=>p.id===selectedId); if(!p) return;
  p.x=x-dragOffX; p.y=y-dragOffY; render();
});
window.addEventListener('mouseup', ()=>dragging=false);

document.getElementById('downloadEdit').onclick = () => {
  selectedId=null; render();
  const a=document.createElement('a'); a.download='cartel_editado.png'; a.href=editCanvas.toDataURL('image/png'); a.click();
};

document.getElementById('saveToBackend').onclick = () => {
  if (!currentEditId) return;
  selectedId=null; render();
  editCanvas.toBlob(async (blob) => {
    const form = new FormData();
    form.append('imagen', blob, 'cartel.png');
    const res = await fetch(`${API_URL}/api/carteles/${currentEditId}`, { method:'PUT', body: form });
    if (res.ok) { alert('Guardado en el backend'); document.getElementById('editorModal').style.display='none'; loadGrid(); }
    else alert('Error al guardar');
  }, 'image/png');
};

initTabs();
loadGrid();
</script>
</body>
</html>
